apiVersion: v1
kind: Pod
metadata:
  name: pvc-check
  namespace: k3s-smoke
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim: { claimName: data }
