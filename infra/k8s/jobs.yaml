# One-shot setup: apply migrations (ConfigMap movies-migrations is created from
# ../../migrations by the Makefile), then seed the first admin.
apiVersion: batch/v1
kind: Job
metadata:
  name: movies-migrate
  namespace: movies
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: migrate/migrate:v4.18.3
          args: ["-path=/migrations", "-database", "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=$(DB_SSLMODE)", "up"]
          envFrom:
            - configMapRef: { name: movies-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: movies-secrets, key: DB_PASSWORD } }
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: movies-migrations
---
apiVersion: batch/v1
kind: Job
metadata:
  name: movies-seed-admin
  namespace: movies
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: movies-api:lab
          imagePullPolicy: Never
          command: ["/usr/local/bin/movies-seed"]
          envFrom:
            - configMapRef: { name: movies-config }
            - secretRef: { name: movies-secrets }
