basePath: /api/v1
definitions:
  model.ErrorDetail:
    properties:
      code:
        example: validation_error
        type: string
      message:
        example: title is required
        type: string
    type: object
  model.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/model.ErrorDetail'
    type: object
  model.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  model.MovieRequest:
    properties:
      country:
        example: United States
        type: string
      director:
        example: Lana Wachowski
        type: string
      genre:
        example: Science Fiction
        type: string
      release_year:
        description: ReleaseYear may be omitted or set to null.
        example: 1999
        type: integer
      synopsis:
        description: Synopsis may be omitted or set to null; an empty string is valid.
        example: A computer hacker learns about reality.
        type: string
      title:
        example: The Matrix
        type: string
    required:
    - country
    - director
    - genre
    - title
    type: object
  model.MovieResponse:
    properties:
      country:
        example: United States
        type: string
      created_at:
        example: "2026-10-05T12:00:00.123456Z"
        format: date-time
        type: string
      director:
        example: Lana Wachowski
        type: string
      genre:
        example: Science Fiction
        type: string
      id:
        example: 1
        maximum: 4294967295
        minimum: 1
        type: integer
      release_year:
        description: ReleaseYear is always present and may be null.
        example: 1999
        type: integer
      synopsis:
        description: Synopsis is always present and may be null.
        example: A computer hacker learns about reality.
        type: string
      title:
        example: The Matrix
        type: string
      updated_at:
        example: "2026-10-05T12:00:00.123456Z"
        format: date-time
        type: string
    type: object
  model.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  model.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  model.UpdateRoleRequest:
    properties:
      role:
        type: string
    type: object
  model.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
info:
  contact: {}
  description: REST API for creating, listing, replacing, and deleting movies.
  title: Movie API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Returns a Bearer access token for a valid email and password.
      parameters:
      - description: Login payload
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a viewer account. Role cannot be set by the client.
      parameters:
      - description: Registration payload
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.UserResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Register a user
      tags:
      - auth
  /health:
    get:
      consumes:
      - application/json
      description: Reports whether the API process is responding.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Health check
      tags:
      - health
  /me:
    get:
      consumes:
      - application/json
      description: Returns the authenticated user's public profile.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - users
  /movies:
    get:
      consumes:
      - application/json
      description: Returns movies ordered by ascending ID. Filtering is applied before
        pagination; limits above 100 are capped.
      parameters:
      - default: 1
        description: Page number, starting at 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Page size, capped at 100
        in: query
        minimum: 1
        name: limit
        type: integer
      - description: Exact, case-sensitive genre filter
        in: query
        name: genre
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.MovieResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: List movies
      tags:
      - movies
    post:
      consumes:
      - application/json
      description: Creates a movie. Required strings are validated manually; omitted
        optional fields are null.
      parameters:
      - description: Movie to create
        in: body
        name: movie
        required: true
        schema:
          $ref: '#/definitions/model.MovieRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.MovieResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a movie
      tags:
      - movies
  /movies/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes one movie and returns an empty response.
      parameters:
      - description: Movie ID
        in: path
        maximum: 4294967295
        minimum: 0
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a movie
      tags:
      - movies
    get:
      consumes:
      - application/json
      description: Returns one movie by its uint32 ID.
      parameters:
      - description: Movie ID
        in: path
        maximum: 4294967295
        minimum: 0
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MovieResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Get a movie
      tags:
      - movies
    put:
      consumes:
      - application/json
      description: Fully replaces a movie. Required fields are replaced, and omitted
        optional fields become null.
      parameters:
      - description: Movie ID
        in: path
        maximum: 4294967295
        minimum: 0
        name: id
        required: true
        type: integer
      - description: Replacement movie
        in: body
        name: movie
        required: true
        schema:
          $ref: '#/definitions/model.MovieRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MovieResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace a movie
      tags:
      - movies
  /users:
    get:
      consumes:
      - application/json
      description: Returns users ordered by ascending ID. Limits above 100 are capped.
      parameters:
      - default: 1
        description: Page number, starting at 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Page size, capped at 100
        in: query
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.UserResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
  /users/{id}/role:
    put:
      consumes:
      - application/json
      description: Sets a user's role. The last remaining admin cannot be demoted.
      parameters:
      - description: User ID
        in: path
        minimum: 0
        name: id
        required: true
        type: integer
      - description: New role
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/model.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a user's role
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and the JWT. Example: "Bearer
      <token>".'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
