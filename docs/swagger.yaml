basePath: /api/v1
definitions:
  model.ErrorDetail:
    properties:
      code:
        example: validation_error
        type: string
      message:
        example: title is required
        type: string
    type: object
  model.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/model.ErrorDetail'
    type: object
  model.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  model.MovieRequest:
    properties:
      country:
        example: United States
        type: string
      director:
        example: Lana Wachowski
        type: string
      genre:
        example: Science Fiction
        type: string
      release_year:
        description: ReleaseYear may be omitted or set to null.
        example: 1999
        type: integer
      synopsis:
        description: Synopsis may be omitted or set to null; an empty string is valid.
        example: A computer hacker learns about reality.
        type: string
      title:
        example: The Matrix
        type: string
    required:
    - country
    - director
    - genre
    - title
    type: object
  model.MovieResponse:
    properties:
      country:
        example: United States
        type: string
      created_at:
        example: "2026-10-05T12:00:00.123456Z"
        format: date-time
        type: string
      director:
        example: Lana Wachowski
        type: string
      genre:
        example: Science Fiction
        type: string
      id:
        example: 1
        maximum: 4294967295
        minimum: 1
        type: integer
      release_year:
        description: ReleaseYear is always present and may be null.
        example: 1999
        type: integer
      synopsis:
        description: Synopsis is always present and may be null.
        example: A computer hacker learns about reality.
        type: string
      title:
        example: The Matrix
        type: string
      updated_at:
        example: "2026-10-05T12:00:00.123456Z"
        format: date-time
        type: string
    type: object
info:
  contact: {}
  description: REST API for creating, listing, replacing, and deleting movies.
  title: Movie API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Reports whether the API process is responding.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Health check
      tags:
      - health
  /movies:
    get:
      consumes:
      - application/json
      description: Returns movies ordered by ascending ID. Filtering is applied before
        pagination; limits above 100 are capped.
      parameters:
      - default: 1
        description: Page number, starting at 1
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 10
        description: Page size, capped at 100
        in: query
        minimum: 1
        name: limit
        type: integer
      - description: Exact, case-sensitive genre filter
        in: query
        name: genre
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.MovieResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: List movies
      tags:
      - movies
    post:
      consumes:
      - application/json
      description: Creates a movie. Required strings are validated manually; omitted
        optional fields are null.
      parameters:
      - description: Movie to create
        in: body
        name: movie
        required: true
        schema:
          $ref: '#/definitions/model.MovieRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.MovieResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Create a movie
      tags:
      - movies
  /movies/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes one movie and returns an empty response.
      parameters:
      - description: Movie ID
        in: path
        maximum: 4294967295
        minimum: 0
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Delete a movie
      tags:
      - movies
    get:
      consumes:
      - application/json
      description: Returns one movie by its uint32 ID.
      parameters:
      - description: Movie ID
        in: path
        maximum: 4294967295
        minimum: 0
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MovieResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Get a movie
      tags:
      - movies
    put:
      consumes:
      - application/json
      description: Fully replaces a movie. Required fields are replaced, and omitted
        optional fields become null.
      parameters:
      - description: Movie ID
        in: path
        maximum: 4294967295
        minimum: 0
        name: id
        required: true
        type: integer
      - description: Replacement movie
        in: body
        name: movie
        required: true
        schema:
          $ref: '#/definitions/model.MovieRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MovieResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Replace a movie
      tags:
      - movies
swagger: "2.0"
